name: Deploy main to Pantheon Dev

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false   # Never cancel a dev deploy mid-flight

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    if: vars.IS_UPSTREAM != 'true'
    name: Deploy main → Pantheon Dev
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      target_env: dev
      delete_old_environments: true

  post-deploy:
    if: vars.IS_UPSTREAM != 'true'
    name: Post-deploy tasks
    needs: deploy
    uses: ./.github/workflows/_post-deploy.yml
    secrets: inherit
    with:
      pantheon_env: dev
